[package]
name = "project-s"
version = "1.0.2"
description = "Project-S"
authors = ["mb"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "project_s_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# tray-icon feature: menu-bar quick-capture entry point
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled", "trace"] }
notify = "8"
base64 = "0.22"
zip = "8"
quick-xml = "0.42"
pdf-extract = "0.12"
# static C extension compiled locally by `cc`; no network at build time.
# 0.1.10-alpha.4 is unusable: its published package omits sqlite-vec-diskann.c.
sqlite-vec = "=0.1.9"
# blocking pure-Rust HTTP (no async runtime); rustls TLS on by default because
# LLM endpoints are HTTPS (Ollama http:// still works through the same agent)
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
# In-process ONNX inference for EmbeddingGemma 2 (text encoder), now the
# default backend. `ort` downloads ONNX Runtime binaries once at build time
# and caches them under ~/Library/Caches/ort.pyke.io, so rebuilds after the
# first online build work offline.
ort = { version = "=2.0.0-rc.14", optional = true }
tokenizers = { version = "0.22", optional = true }
# sha256 verification of downloaded model files (ort-backend only)
sha2 = { version = "0.10", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
iana-time-zone = "0.1.65"
tauri-plugin-notification = "2.4.0"
# macOS LaunchAgent autostart
tauri-plugin-autostart = "2"
# global CmdOrCtrl+Shift+Space quick-capture shortcut
tauri-plugin-global-shortcut = "2"
# blocking WebSocket client for the CDP browser bridge; default
# features are handshake-only (no TLS stack) because ws:// targets localhost.
tungstenite = "0.29"
# native document generation for the agent doc tools (agent/doc_tools.rs):
# DOCX, XLSX and PDF writers, pure Rust, no external binaries.
docx-rs = "0.4.22"
rust_xlsxwriter = "0.100.0"
# NFC/NFD folding in the lenient path resolver (fs_ops::fold_name); already a
# transitive dep, pinned to the version in Cargo.lock so no new download.
unicode-normalization = "0.1.25"
printpdf = { version = "0.12.8", default-features = false }

[features]
# ONNX text embedder + model provisioning is the default embedding backend.
# Note: the Tauri CLI always builds with --no-default-features, so the app
# build gets this feature via tauri.conf.json build.features.
default = ["ort-backend"]
# ureq TLS is now a default feature, so this feature only adds the ONNX stack.
ort-backend = ["dep:ort", "dep:tokenizers", "dep:sha2"]
